name: Daily German news ingest
on:
  schedule:
    # 05:00 UTC is 06:00 CET; GitHub cron cannot follow Europe/Berlin DST.
    # The workflow also supports manual dispatch, so schedule it at 04:00 UTC in CEST months if exact 06:00 is required.
    - cron: '0 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.txt
      - run: python -m app.cli
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///../data/german_helper.db
          NEWS_PROVIDER: gnews
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          NEWS_LANGUAGE: de
          NEWS_COUNTRY: de
          NEWS_MAX_ARTICLES: 10
      - name: Commit durable SQLite artifact
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/german_helper.db
          git diff --cached --quiet || git commit -m "chore: refresh daily German news"
          git push
