name: Daily German news ingest
on:
  schedule:
    # GitHub cron is UTC. This runs at 05:00 UTC (06:00 CET); in summer it runs at 07:00 CEST.
    - cron: '0 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.txt
      - run: python -m app.cli
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///../data/german_helper.db
      - name: Commit durable SQLite artifact
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/german_helper.db
          git diff --cached --quiet || git commit -m "chore: refresh daily German news"
          git push
